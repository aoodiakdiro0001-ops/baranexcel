function doPrint(){let h='<table><tr><th></th>';for(let c=0;c<COLS;c++)h+=`<th>${cn(c)}</th>`;h+='</tr>';
for(let r=1;r<=ROWS;r++){let rowHtml='',empty=true;for(let c=0;c<COLS;c++){const d=sh().data[ck(r,c)];let v='';if(d){if(d.f!=null){try{v=ev(parse(d.f),new Set());}catch(e){v='';}}else v=d.v==null?'':d.v;if(v!==''&&v!=null)empty=false;}rowHtml+=`<td>${esc(v)}</td>`;}
if(!empty)h+=`<tr><th>${r}</th>${rowHtml}</tr>`;else break;}
document.getElementById('printTbl').innerHTML=h+'</table>';window.print();}
function toggleTheme(){document.body.classList.toggle('light');}
function chartDlg(){document.getElementById('chartModal').classList.add('show');drawChart();}
function closeModal(){document.getElementById('chartModal').classList.remove('show');}
function chartData(){
const r1=Math.min(SEL.r,SEL.r2),r2=Math.max(SEL.r,SEL.r2),c1=Math.min(SEL.c,SEL.c2),c2=Math.max(SEL.c,SEL.c2);
const grid=selVals();
const labels=[],series=[[],[],[]];
if(c1===c2){for(let r=r1;r<=r2;r++)labels.push('R'+r);}
else{for(let c=c1+1;c<=c2&&c-c1<=3;c++)series[c-c1-1].name=cn(c);}
if(c1===c2){for(let r=r1;r<=r2;r++){const v=grid[r-r1][0];series[0].push(typeof v==='number'?v:parseFloat(v)||0);}}
else{for(let r=r1;r<=r2;r++){labels.push(String(grid[r-r1][0]));for(let s=0;s<3&&c1+1+s<=c2;s++){const v=grid[r-r1][c1+1+s-c1];series[s].push(typeof v==='number'?v:parseFloat(v)||0);}}}
return {labels,series:series.filter(s=>s.length)};
}
function drawChart(){
const ty=document.getElementById('chType').value;
const {labels,series}=chartData();
const cv=document.getElementById('chCv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
ctx.fillStyle='#0b0e17';ctx.fillRect(0,0,W,H);
if(!series.length||!series[0].length){ctx.fillStyle='#8b98b8';ctx.fillText('no data',20,20);return;}
const cols=['#34d399','#60a5fa','#fbbf24'];
if(ty==='pie'){
const vals=series[0],tot=vals.reduce((a,b)=>a+b,0)||1;let a0=-Math.PI/2;
vals.forEach((v,i)=>{const a1=a0+v/tot*Math.PI*2;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.arc(W/2,H/2,Math.min(W,H)/2-30,a0,a1);ctx.closePath();ctx.fillStyle=cols[i%3];ctx.fill();a0=a1;
ctx.fillStyle='#dbe4f3';ctx.font='11px sans-serif';ctx.fillText(String(labels[i]||i).slice(0,12),10,20+i*16);});
return;}
const all=series.flat();const mx=Math.max(...all,0),mn=Math.min(...all,0);
const L=50,B=H-30,T=15,X0=L,X1=W-15,Y0=T,Y1=H-B;
ctx.strokeStyle='#2a3557';ctx.beginPath();ctx.moveTo(X0,T);ctx.lineTo(X0,Y1);ctx.lineTo(X1,Y1);ctx.stroke();
const n=labels.length,bw=(X1-X0)/Math.max(1,n);
series.forEach((S,si)=>{
ctx.strokeStyle=cols[si%3];ctx.fillStyle=cols[si%3];
if(ty==='bar'){S.forEach((v,i)=>{const h=(v-mn)/((mx-mn)||1)*(Y1-T-10);const x=X0+i*bw+bw*0.15+si*(bw*0.7/Math.max(1,series.length));ctx.fillRect(x,Y1-h,bw*0.7/Math.max(1,series.length),h);});}
else{S.forEach((v,i)=>{const x=X0+i*bw+bw/2,y=Y1-(v-mn)/((mx-mn)||1)*(Y1-T-10);if(i===0){ctx.beginPath();ctx.moveTo(x,y);}else ctx.lineTo(x,y);ctx.fillRect(x-2,y-2,4,4);});ctx.stroke();}
});
ctx.fillStyle='#8b98b8';ctx.font='10px sans-serif';
labels.forEach((l,i)=>{if(i%Math.ceil(n/8)===0)ctx.fillText(String(l).slice(0,8),X0+i*bw, H-12);});
}
function describe(n){
if(!n)return '?';
if(n.t==='lit')return typeof n.v==='string'?'"'+n.v+'"':String(n.v);
if(n.t==='cell')return n.c.c+n.c.r;
if(n.t==='range')return (n.c1.c+n.c1.r)+':'+(n.c2.c+n.c2.r);
if(n.t==='pct')return describe(n.v)+'%';
if(n.t==='un')return n.o+describe(n.v);
if(n.t==='bin'){const ops={'+':'plus','-':'minus','*':'times','/':'divided by','^':'to the power','&':'joined with','=':'equals','<':'less than','>':'greater than','<=':'≤','>=':'≥','<>':'≠'};return describe(n.l)+' '+(ops[n.o]||n.o)+' '+describe(n.r);}
if(n.t==='fn'){const xs=n.args.map(describe).join(', ');const e=(EXPL[n.n]||{en:''})[lang]||EXPL[n.n];return (EXPL[n.n]?(EXPL[n.n][lang]||EXPL[n.n].en):n.n)+' ('+xs+')';}
return '?';
}
function aiDo(kind){
const box=document.getElementById('aiOut');
if(kind==='exp'){
const d=sh().data[ck(SEL.r,SEL.c)];
if(!d||d.f==null){toast(t('needFormula'));box.innerHTML='';return;}
try{box.innerHTML=`<b>${t('expT')}</b><br><code style="direction:ltr">${esc(d.f)}</code><br>= ${esc(describe(parse(d.f)))}`;}catch(e){box.innerHTML=t('needFormula');}
}else if(kind==='ins'){
const vals=selVals().flat().filter(v=>typeof v==='number');
if(!vals.length){toast(t('needSel'));box.innerHTML='';return;}
const s=vals.reduce((a,b)=>a+b,0),av=s/vals.length;
const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-av)*(b-av),0)/vals.length);
const out=vals.filter(v=>Math.abs(v-av)>2*sd);
const seen={},dup=[];vals.forEach(v=>{seen[v]=(seen[v]||0)+1;});Object.keys(seen).forEach(k=>{if(seen[k]>1)dup.push(k);});
const half=Math.floor(vals.length/2),f=vals.slice(0,half),l=vals.slice(half);
const fav=f.length?f.reduce((a,b)=>a+b,0)/f.length:0,lav=l.length?l.reduce((a,b)=>a+b,0)/l.length:0;
const tr=lav>fav*1.05?t('upL'):lav<fav*0.95?t('dnL'):t('flatL');
box.innerHTML=`<b>${t('insT')}</b> n=${vals.length}<br>${t('sumL')}: ${Math.round(s*100)/100} · ${t('avgL')}: ${Math.round(av*100)/100} · ${t('minL')}: ${Math.min(...vals)} · ${t('maxL')}: ${Math.max(...vals)}<br>${t('outL')}: ${out.length?out.join(', '):'—'}<br>${t('dupL')}: ${dup.length?dup.join(', '):'—'}<br>${t('trendL')}: ${tr}`;
}else if(kind==='dup'){
const vals=selVals().flat().map(String);
if(!vals.length){toast(t('needSel'));box.innerHTML='';return;}
const seen={};vals.forEach(v=>{if(v!=='')seen[v]=(seen[v]||0)+1;});
const dup=Object.keys(seen).filter(k=>seen[k]>1);
box.innerHTML=`<b>${t('dupL')}</b>: ${dup.length?dup.map(esc).join(', '):'—'}`;
}else if(kind==='nl'){
const q=document.getElementById('nlIn').value.trim();
const f=nlFormula(q);
if(!f){toast(t('nlFail'));box.innerHTML='';return;}
commitCell(SEL.r,SEL.c,f,true);renderGrid();autoSave();
box.innerHTML=`<code style="direction:ltr">${esc(f)}</code><br>${t('nlDone')}`;
}
}
function nlFormula(q){
const m0=q.match(/([A-Za-z]+\d+)\s*(?:to|[-:]|إلى|إلي|ile)\s*([A-Za-z]+\d+)/i);
const R=m0?('$1:$2'.replace('$1',m0[1].toUpperCase()).replace('$2',m0[2].toUpperCase())):null;
const low=q.toLowerCase();
const has=(...ws)=>ws.some(w=>low.includes(w));
if(R){
if(has('sum','toplam','مجموع','topla'))return '=SUM('+R+')';
if(has('average','avg','ortalama','متوسط'))return '=AVERAGE('+R+')';
if(has('minimum','min ','en küçük','الأدنى'))return '=MIN('+R+')';
if(has('maximum','max ','en büyük','الأقصى'))return '=MAX('+R+')';
if(has('count','say','عدد','adet'))return '=COUNT('+R+')';
}
const mIf=q.match(/if\s+(.+?)\s+then\s+(.+?)\s+else\s+(.+)/i);
if(mIf)return '=IF('+mIf[1]+', '+mIf[2]+', '+mIf[3]+')';
return null;
}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
function gridEvents(){
const box=document.getElementById('sheetBox');
box.addEventListener('click',e=>{
const td=e.target.closest('td');if(!td)return;
const r=+td.dataset.r,c=+td.dataset.c;
if(e.shiftKey){SEL.r2=r;SEL.c2=c;}else{SEL={r,c,r2:r,c2:c};}
renderGrid();box.focus();
});
box.addEventListener('dblclick',e=>{
const td=e.target.closest('td');if(!td)return;
const r=+td.dataset.r,c=+td.dataset.c;
SEL={r,c,r2:r,c2:c};
const d=sh().data[ck(r,c)];
td.innerHTML='';
const inp=document.createElement('input');inp.className='ce';
inp.value=d?(d.f!=null?d.f:(d.v==null?'':d.v)):'';
td.appendChild(inp);inp.focus();inp.select();
const done=(ok)=>{if(ok)commitCell(r,c,inp.value);renderGrid();box.focus();};
inp.addEventListener('blur',()=>done(true));
inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();done(true);}if(ev.key==='Escape')done(false);ev.stopPropagation();});
});
const fx=document.getElementById('fxBar');
fx.addEventListener('keydown',e=>{
if(e.key==='Enter'){commitCell(SEL.r,SEL.c,fx.value);SEL.r=Math.min(ROWS,SEL.r+1);SEL.r2=SEL.r;renderGrid();box.focus();}
if(e.key==='Escape'){updateBar();box.focus();}
e.stopPropagation();});
box.addEventListener('keydown',e=>{
const k=e.key;let {r,c}=SEL;
const mv=(dr,dc)=>{r=Math.max(1,Math.min(ROWS,r+dr));c=Math.max(0,Math.min(COLS-1,c+dc));
if(e.shiftKey){SEL.r2=r;SEL.c2=c;}else{SEL={r,c,r2:r,c2:c};}
renderGrid();e.preventDefault();};
if(k==='ArrowUp')mv(-1,0);else if(k==='ArrowDown')mv(1,0);else if(k==='ArrowLeft')mv(0,-1);else if(k==='ArrowRight')mv(0,1);
else if(k==='Enter'){const d=sh().data[ck(r,c)];SEL.r=Math.min(ROWS,r+1);SEL.r2=SEL.r;renderGrid();e.preventDefault();}
else if(k==='Tab'){SEL.c=Math.min(COLS-1,c+1);SEL.c2=SEL.c;renderGrid();e.preventDefault();}
else if((k==='Delete'||k==='Backspace')){clrCell();e.preventDefault();}
else if(k==='z'&&(e.ctrlKey||e.metaKey)&&!e.shiftKey){undo();e.preventDefault();}
else if((k==='y'&&(e.ctrlKey||e.metaKey))||(k==='z'&&(e.ctrlKey||e.metaKey)&&e.shiftKey)){redo();e.preventDefault();}
else if(k==='c'&&(e.ctrlKey||e.metaKey)){doCopy(false);e.preventDefault();}
else if(k==='x'&&(e.ctrlKey||e.metaKey)){doCopy(true);e.preventDefault();}
else if(k==='v'&&(e.ctrlKey||e.metaKey)){doPaste(e);e.preventDefault();}
else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
const td=box.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
if(td){const d=sh().data[ck(r,c)];td.innerHTML='';const inp=document.createElement('input');inp.className='ce';inp.value=k;
td.appendChild(inp);inp.focus();
inp.addEventListener('blur',()=>{commitCell(r,c,inp.value);renderGrid();});
inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();commitCell(r,c,inp.value);renderGrid();box.focus();}ev.stopPropagation();});
e.preventDefault();}}
});
}
function doCopy(cut){
const r1=Math.min(SEL.r,SEL.r2),r2=Math.max(SEL.r,SEL.r2),c1=Math.min(SEL.c,SEL.c2),c2=Math.max(SEL.c,SEL.c2);
const rows=[];
for(let r=r1;r<=r2;r++){const row=[];for(let c=c1;c<=c2;c++){const d=sh().data[ck(r,c)];row.push(d?(d.f!=null?d.f:(d.v==null?'':d.v)):'');}rows.push(row.join('\t'));}
const txt=rows.join('\n');
try{if(navigator.clipboard)navigator.clipboard.writeText(txt);}catch(e){}
window._clip=txt;
if(cut)clrCell();else toast(t('copied'));
}
async function doPaste(e){
let txt='';
try{if(navigator.clipboard)txt=await navigator.clipboard.readText();}catch(err){}
if(!txt&&window._clip)txt=window._clip;
if(!txt)return;
const rows=txt.split(/\r?\n/);
rows.forEach((ln,i)=>{if(!ln.trim())return;const cells=ln.split('\t');
cells.forEach((v,j)=>{const r=SEL.r+i,c=SEL.c+j;if(r<=ROWS&&c<COLS)commitCell(r,c,v,true);});});
renderGrid();autoSave();if(e)e.preventDefault();
}
function loadWB(){
try{const w=JSON.parse(localStorage.getItem('bx_wb'));if(w&&w.sheets&&w.sheets.length){WB=w;SI=Math.min(w.si||0,w.sheets.length-1);return;}}catch(e){}
WB=blankWB();
WB.sheets[0].data['1,0']={v:'Item'};WB.sheets[0].data['1,1']={v:'Qty'};WB.sheets[0].data['1,2']={v:'Price'};
WB.sheets[0].data['2,0']={v:'Apples'};WB.sheets[0].data['2,1']={v:10};WB.sheets[0].data['2,2']={v:2.5};
WB.sheets[0].data['3,0']={v:'Bread'};WB.sheets[0].data['3,1']={v:4};WB.sheets[0].data['3,2']={v:3};
WB.sheets[0].data['4,0']={v:'Total'};WB.sheets[0].data['4,2']={v:null,f:'=SUM(C2:C3)'};
}
loadWB();gridEvents();setLang('en');loadAds();renderDonate();renderSheets();renderGrid();
</script>
